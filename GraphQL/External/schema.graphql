schema {
  query: Query
  mutation: Mutation
}

type City {
  id: ID!
  city: String!
  province: String!
  country: String!
}

input CityInput {
  id: ID
  city: String
  province: String
  country: String
}

type Employee {
  id: ID!
  firstName: String!
  lastName: String!
  position: String!
  phoneNumber: String!
  email: String!
}

input EmployeeInput {
  id: ID
  firstName: String
  lastName: String
  position: String
  phoneNumber: String
  email: String
}

"##################################### MUTATIONS ######################################"
type Mutation {
  saveStatus(status: StatusInput): Status
  deleteStatus(id: Int!): Boolean
  saveSchedule(schedule: ScheduleInput): Schedule
  deleteSchedule(id: Int!): Boolean
  saveTrain(train: TrainInput): Train
  deleteTrain(id: Int!): Boolean
  saveCity(city: CityInput): City
  deleteCity(id: Int!): Boolean
  saveEmployee(employee: EmployeeInput): Employee
  deleteEmployee(id: Int!): Boolean
  saveStation(station: StationInput): Station
  deleteStation(id: Int!): Boolean
  saveRoute(route: RouteInput): Route
  deleteRoute(id: Int!): Boolean
}

type Query {
  schedules: [Schedule!]!
  schedulesFiltered(startStationId: Int, endStationId: Int, startDate: String, endDate: String, passengers: Int): [Schedule!]!
  scheduleById(id: Int): Schedule
  status: [Status!]!
  statusById(id: Int): Status
  trains: [Train!]!
  trainById(id: Int): Train
  cities: [City!]!
  cityById(id: Int): City
  employees: [Employee!]!
  employeeById(id: Int): Employee
  stations: [Station!]!
  stationById(id: Int): Station
  routes: [Route!]!
  routeById(id: Int): Route
}

type Route {
  id: ID!
  startStation: Station
  endStation: Station
  distance: Float
}

input RouteInput {
  id: ID
  startStationId: Int
  endStationId: Int
  distance: Float
}

type Schedule {
  id: ID!
  train: Train
  route: Route
  departureTime: String
  arrivalTime: String
  status: Status
}

input ScheduleInput {
  id: ID
  trainId: Int
  statusId: Int
  routeId: Int
  departureTime: String
  arrivalTime: String
}

type Station {
  id: ID!
  name: String!
  countryCode: String!
  phone: String!
  postalCode: String!
  latitude: Float
  longitude: Float
  city: City
  imageUrl: String
}

input StationInput {
  id: ID
  name: String
  countryCode: String
  phone: String
  postalCode: String
  latitude: Float
  longitude: Float
  cityId: Int
  imageUrl: String
}

type Status {
  id: ID!
  name: String!
  description: String
  schedules: [Schedule!]
}

input StatusInput {
  id: ID
  name: String!
  description: String!
}

type Train {
  id: ID!
  type: String!
  capacity: Int
  maxSpeed: Float
}

input TrainInput {
  id: ID
  type: String
  capacity: Int
  maxSpeed: Float
}

"Indicates an Input Object is a OneOf Input Object."
directive @oneOf on INPUT_OBJECT